<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مكتبة سيف العشيرة — فهرس المكتبة المنزلية</title>
    <meta
      name="description"
      content="فهرس المكتبة المنزلية: أرففها وتصانيفها وحكاياتها الصغيرة بين الصفحات."
    />
    <link rel="icon" type="image/svg+xml" href="./assets/logo.svg" />

    <!-- أول ما يُطلب بعد الصفحة: وصلة Convex وخطّ «كتاب». تمهيد الوصلة يوفّر
         مصافحة TLS كاملة قبل أول استعلام، وسبقُ الخطّ يمنع ارتجاف النصّ. -->
    <link rel="preconnect" href="%VITE_CONVEX_URL%" crossorigin />
    <link
      rel="preload"
      href="./fonts/Kitab-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />

    <!-- أميري بديلُ «كتاب» وحده. تُجلب ورقتُه غير حاجبةٍ للرسم (media=print
         حتى تصل، ثم تُعمَّم)، فلا تنتظر الصفحةُ جوجل كي تظهر. وبقيّة العائلات
         (Cairo وMarkazi وTajawal) لا تُجلب إلا إن اختار القارئ خطَّها —
         يتكفّل بذلك ensureWebFont في theme.ts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
