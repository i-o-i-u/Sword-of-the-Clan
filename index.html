<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مكتبة سَيْف العشيرة</title>
    <meta
      name="description"
      content="فهرس مكتبة سيف العشيرة، بيانات الكتب، ومؤلفيها، ومحققيها، وتوابع الفهرسة، مُسهَّلةً مجموعةً في مكان واحد."
    />
    <link rel="icon" type="image/svg+xml" href="./assets/logo.svg" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- لونُ شريط المتصفّح على الجوّال: أرضُ المظهر الدافئ، والداكنُ لمن اختاره نظامُه -->
    <meta name="theme-color" content="#f6efe4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#2b241f" media="(prefers-color-scheme: dark)" />

    <!-- معاينةُ الرابط حين يُشارَك في رسالةٍ أو منشور: كان يُرسَل بلا عنوانٍ ولا
         صورة. والصورةُ برابطٍ تامّ لأن المعاينات لا تقبل غيره. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_SA" />
    <meta property="og:site_name" content="مكتبة سَيْف العشيرة" />
    <meta property="og:title" content="مكتبة سَيْف العشيرة" />
    <meta
      property="og:description"
      content="فهرس مكتبة سيف العشيرة: كتبها ومؤلِّفوها ومحقِّقوها وطبعاتها وفوائدها، مجموعةً في مكانٍ واحد."
    />
    <meta property="og:url" content="https://i-o-i-u.web.app/" />
    <meta property="og:image" content="https://i-o-i-u.web.app/assets/library-cover.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- أول ما يُطلب بعد الصفحة: وصلة Convex وخطّ «كتاب». تمهيد الوصلة يوفّر
         مصافحة TLS كاملة قبل أول استعلام، وسبقُ الخطّ يمنع ارتجاف النصّ. -->
    <link rel="preconnect" href="%VITE_CONVEX_URL%" crossorigin />
    <link
      rel="preload"
      href="./fonts/Kitab-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- أميري بديلُ «كتاب» وحده. تُجلب ورقتُه غير حاجبةٍ للرسم (media=print
         حتى تصل، ثم تُعمَّم)، فلا تنتظر الصفحةُ جوجل كي تظهر. وبقيّة العائلات
         (Cairo وMarkazi وTajawal) لا تُجلب إلا إن اختار القارئ خطَّها —
         يتكفّل بذلك ensureWebFont في theme.ts. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="max-width: 560px; margin: 80px auto; padding: 0 20px; text-align: center; line-height: 2; font-family: serif;">
        فهرسُ مكتبة سيف العشيرة يحتاج إلى تشغيل JavaScript في المتصفّح.
      </p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
