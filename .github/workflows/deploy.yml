name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Node 24 للبناء وللأدوات جميعًا: أدواتُ الإصدارات السابقة تجري على
      # Node 20، وقد نُعيَ وصار كلُّ نشرٍ يحمل تحذيرَه. فكلُّ أداةٍ هنا على
      # إصدارها الذي يجري على node24 (`using: node24` في action.yml).
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # convex deploy يدفع الدوال إلى نشر الإنتاج ثم يبني الواجهة، وهو نفسه
      # يضبط VITE_CONVEX_URL على رابط ذلك النشر — فلا يُضبط يدويًّا. ولذلك
      # يجري البناءان تحته جميعًا: دفعةٌ واحدة للدوال، وحزمتان للواجهة —
      # `dist` بأساس مسار Pages، و`dist-root` بأساس جذر النطاق لفايربيس.
      - name: Build
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy --cmd 'npm run build:deploy'

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # فايربيس يُنشر من هذه الوظيفة نفسها لأن `dist-root` على قرصها. ونشرُ
      # Pages وظيفةٌ على حدة لأن أداته تشترط ذلك. والاثنان من الدفعة نفسها،
      # فالموقعان متطابقان أبدًا.
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: i-o-i-u
          channelId: live

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
